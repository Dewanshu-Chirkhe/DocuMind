spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/documind
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          options:
            model: gemini-3.5-flash-lite

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 1536

    vectorstore:
      pgvector:
        initialize-schema: true
        remove-existing-vector-store-table: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE